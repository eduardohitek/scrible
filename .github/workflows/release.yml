name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar mise
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Conferir tag × versão do package.json
        run: ./scripts/check-version.sh "$GITHUB_REF_NAME"

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependências
        run: mise run setup

      - name: Build (.app / .dmg, assinatura ad-hoc)
        run: mise run build

      - name: Gerar checksum
        working-directory: src-tauri/target/release/bundle/dmg
        run: shasum -a 256 *.dmg > SHA256SUMS.txt

      - name: Publicar release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Build para **macOS Apple Silicon (arm64)** apenas.

            ⚠️ Este `.dmg` não é assinado nem notarizado pela Apple (assinatura ad-hoc,
            sem conta de desenvolvedor). Ao abrir pela primeira vez, o macOS vai avisar
            que não foi possível verificar o desenvolvedor — libere em
            **Ajustes do Sistema → Privacidade e Segurança → Abrir Mesmo Assim**.

            Para conferir a integridade do download:
            ```sh
            shasum -a 256 -c SHA256SUMS.txt
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
