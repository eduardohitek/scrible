name: Release

on:
  push:
    tags:
      - "v*"
  # Disparado por auto-tag.yml depois do merge do PR de release: o
  # GITHUB_TOKEN padrão não consegue disparar outro workflow via `push` de
  # tag (proteção anti-recursão do GitHub Actions), mas workflow_dispatch é
  # uma exceção explícita a essa regra — ver DECISIONS.md.
  workflow_dispatch:
    inputs:
      # Modo de teste (#32): roda em qualquer branch, builda as 5 plataformas e
      # deixa os instaladores como artefatos do workflow, sem publicar release.
      dry_run:
        description: "Só builda e sobe os instaladores como artefatos (não publica release)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-latest
            build_args: ""
            bundle_glob: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/scrible.app.tar.gz
              src-tauri/target/release/bundle/macos/scrible.app.tar.gz.sig
          - name: windows-x64
            runner: windows-latest
            build_args: "--bundles nsis"
            bundle_glob: |
              src-tauri/target/release/bundle/nsis/*-setup.exe
              src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          - name: windows-arm64
            runner: windows-11-arm
            build_args: "--bundles nsis"
            bundle_glob: |
              src-tauri/target/release/bundle/nsis/*-setup.exe
              src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          - name: linux-x64
            runner: ubuntu-22.04
            build_args: "--bundles appimage,deb"
            bundle_glob: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
              src-tauri/target/release/bundle/deb/*.deb
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            build_args: "--bundles appimage,deb"
            bundle_glob: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
              src-tauri/target/release/bundle/deb/*.deb
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Instalar mise
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Conferir tag × versão do package.json
        if: ${{ !inputs.dry_run }}
        run: ./scripts/check-version.sh "$GITHUB_REF_NAME"

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-npm-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependências
        run: mise run setup

      # Com `createUpdaterArtifacts`, o build também gera o pacote do updater
      # de cada plataforma + .sig, assinados com a chave do updater (minisign,
      # independente da assinatura ad-hoc da Apple). Os bundles de cada
      # plataforma são escolhidos aqui via `--bundles`, sem mexer no
      # `"targets": "all"` global (o `mise run build` local continua igual).
      - name: Build
        run: npm run tauri build -- ${{ matrix.build_args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Os instaladores sempre sobem como artefatos: no modo de teste são o
      # resultado final; numa release real, alimentam o job `publish`.
      - name: Subir instaladores como artefatos
        uses: actions/upload-artifact@v4
        with:
          name: scrible-${{ matrix.name }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error

  # Junta os instaladores das 5 plataformas, gera um único SHA256SUMS.txt e o
  # latest.json do updater (5 chaves) e publica tudo na mesma release (#32).
  # Pre-releases também publicam o manifesto, mas nunca são a "latest" do
  # GitHub — não são oferecidas pelo updater.
  publish:
    if: ${{ !inputs.dry_run }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Baixar artefatos dos builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: scrible-*

      - name: Montar assets (SHA256SUMS.txt + latest.json)
        run: ./scripts/build-release-assets.sh artifacts "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"

      - name: Publicar release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/release/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Builds para **macOS (Apple Silicon)**, **Windows 10/11 (x64 e arm64)** e **Linux (x64 e arm64, Ubuntu 22.04+)**.
            Nenhum instalador tem assinatura de código paga: o sistema vai avisar na primeira abertura, como explicado abaixo.

            ### macOS
            `scrible_*_aarch64.dmg` (Apple Silicon). Assinatura ad-hoc, sem notarização: ao abrir pela
            primeira vez, libere em **Ajustes do Sistema → Privacidade e Segurança → Abrir Mesmo Assim**.

            ### Windows
            `scrible_*_x64-setup.exe` (Intel/AMD) ou `scrible_*_arm64-setup.exe` (ARM). Sem assinatura
            Authenticode: o SmartScreen avisa na primeira vez — clique em **Mais informações → Executar assim mesmo**.

            ### Linux
            - **AppImage** (`scrible_*_amd64.AppImage` / `scrible_*_arm64.AppImage`): `chmod +x scrible_*.AppImage` e execute. É o único formato que se atualiza sozinho.
            - **.deb** (`scrible_*_amd64.deb` / `scrible_*_arm64.deb`): `sudo apt install ./scrible_*.deb`. Não se atualiza pelo app; instale o `.deb` da versão nova.

            Para conferir a integridade do download:
            ```sh
            sha256sum -c SHA256SUMS.txt --ignore-missing   # Linux
            shasum -a 256 -c SHA256SUMS.txt                # macOS
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
