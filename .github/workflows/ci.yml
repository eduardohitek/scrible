name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]

# Um push novo no mesmo PR cancela a execução anterior (na main, cada push roda até o fim).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Sem debuginfo: link mais rápido e cache do target/ menor. O perfil `test` herda do `dev`.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux e Windows desligados por ora (só macOS é publicado). Para religar,
        # volte a matriz para [macos-latest, ubuntu-22.04, windows-latest].
        os: [macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # clippy e os testes Rust compilam o Tauri, que no Linux precisa do WebKitGTK (#32).
      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Instalar mise
        uses: jdx/mise-action@v4
        with:
          cache: true

      # Depois do mise: a chave do cache usa a versão do rustc instalada por ele.
      - name: Cache do Rust (target/ e registro do Cargo)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependências
        run: mise run setup

      - name: Lint (ESLint + clippy)
        run: mise run lint

      - name: Typecheck
        run: mise run typecheck

      - name: Testes
        run: mise run test
